# Import in the ArmorIQ console: Policies -> Import YAML.
# Payments: anything above $5,000 waits for a human; wires are never allowed; the intern can't pay.
apiVersion: armor.io/v1
kind: Policy
metadata:
  name: foreman-payments-need-approval
  orgId: "5e7bc3f7-fd86-4f70-868b-feac25a1ec72"
  targetType: mcp_server
  targetId: "78553455-6179-43ad-a109-8eea9bf6ac49"   # acme-payments-live
spec:
  priority: 200
  status: active
  defaultEnforcementAction: block
  memberRules:
    "raj@acme.coffee":
      allowedTools: []
      enforcementAction: block
    "*":
      allowedTools: [pay_invoice]
      enforcementAction: hold
      toolEnforcement:
        wire_transfer: block
      amountThreshold:
        maxPerTransaction: 20000
        requireApprovalAbove: 5000
        currency: USD
