# Import in the ArmorIQ console: Policies -> Import YAML.
# Refunds: at most $50 per refund; the intern can't refund.
apiVersion: armor.io/v1
kind: Policy
metadata:
  name: foreman-refunds-capped
  orgId: "5e7bc3f7-fd86-4f70-868b-feac25a1ec72"
  targetType: mcp_server
  targetId: "9d29dc90-e4a5-4d45-886a-a6234b488182"   # acme-refunds-live
spec:
  priority: 200
  status: active
  defaultEnforcementAction: block
  memberRules:
    "raj@acme.coffee":
      allowedTools: []
      enforcementAction: block
    "*":
      allowedTools: [refund]
      enforcementAction: allow_log
      amountThreshold:
        maxPerTransaction: 50
        currency: USD
