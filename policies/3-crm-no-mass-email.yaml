# Import in the ArmorIQ console: Policies -> Import YAML.
# Support desk: reading and replying is fine; mass email is never allowed; the intern can only read.
apiVersion: armor.io/v1
kind: Policy
metadata:
  name: foreman-crm-no-mass-email
  orgId: "5e7bc3f7-fd86-4f70-868b-feac25a1ec72"
  targetType: mcp_server
  targetId: "34e7180b-b00f-4d7a-97a0-be5cdaac26b5"   # acme-crm-live
spec:
  priority: 200
  status: active
  defaultEnforcementAction: block
  memberRules:
    "raj@acme.coffee":
      allowedTools: [list_tickets, read_ticket]
      enforcementAction: allow_log
      toolEnforcement:
        reply_ticket: block
        send_newsletter: block
    "*":
      allowedTools: [list_tickets, read_ticket, reply_ticket]
      enforcementAction: allow_log
      toolEnforcement:
        send_newsletter: block
