[project]
name = "foreman"
version = "0.1.0"
description = "Foreman: an AI back office that works under a signed ArmorIQ work order"
authors = [
    { name = "shivam-kumar25", email = "shivamkumargupta250904@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "armoriq-sdk==0.6.10",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
